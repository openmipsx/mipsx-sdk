# mipsx-sdk CI: the simulator, crt0 and packer tests on Linux and macOS,
# and the run-time and picolibc built and tested with the latest
# toolchain release of this repository (release.yml).
#
# Repository variables (optional):
#   MIPSX_LLVM_REPO  owner/name of the LLVM fork (default <owner>/llvm-project)
#   PICOLIBC_REPO    owner/name of the picolibc fork (default <owner>/picolibc)

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MIPSX_LLVM_REPO: ${{ vars.MIPSX_LLVM_REPO || format('{0}/llvm-project', github.repository_owner) }}
  PICOLIBC_REPO: ${{ vars.PICOLIBC_REPO || format('{0}/picolibc', github.repository_owner) }}

jobs:
  check:
    name: make check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Simulator, crt0 and packer tests
        run: make check

  toolchain:
    name: Run-time with the latest toolchain release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the latest toolchain release
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          if ! gh release download --repo "$GITHUB_REPOSITORY" \
              --pattern 'mipsx-toolchain-*-linux-x86_64.tar.xz*' \
              --dir "$RUNNER_TEMP/dist"; then
            echo "::notice::No toolchain release yet; skipping this job"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$RUNNER_TEMP/dist"
          sha256sum -c ./*.sha256
          archive=$(ls ./*.tar.xz)
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "archive=$RUNNER_TEMP/dist/${archive#./}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the release archive
        if: steps.download.outputs.found == 'true'
        run: release/smoke-test.sh "${{ steps.download.outputs.archive }}"

      - name: Extract the toolchain
        if: steps.download.outputs.found == 'true'
        id: toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tc"
          tar -xJf "${{ steps.download.outputs.archive }}" -C "$RUNNER_TEMP/tc" --strip-components=1
          cat "$RUNNER_TEMP/tc/BUILDINFO"
          # BUILDINFO lines: "name: <git describe> <commit>"
          echo "llvm=$(awk '/^llvm-project:/ {print $3}' "$RUNNER_TEMP/tc/BUILDINFO")" >> "$GITHUB_OUTPUT"
          echo "picolibc=$(awk '/^picolibc:/ {print $3}' "$RUNNER_TEMP/tc/BUILDINFO")" >> "$GITHUB_OUTPUT"
          echo "bin=$RUNNER_TEMP/tc/bin" >> "$GITHUB_OUTPUT"

      - name: Check out compiler-rt at the toolchain's commit
        if: steps.download.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MIPSX_LLVM_REPO }}
          ref: ${{ steps.toolchain.outputs.llvm }}
          path: llvm-project
          sparse-checkout: |
            compiler-rt/lib/builtins
            compiler-rt/test/builtins
          persist-credentials: false

      - name: Check out picolibc at the toolchain's commit
        if: steps.download.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PICOLIBC_REPO }}
          ref: ${{ steps.toolchain.outputs.picolibc }}
          path: picolibc
          persist-credentials: false

      - name: Install packages
        if: steps.download.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build

      - name: make check-llvm (crt0 and scripts with llvm-mc and ld.lld)
        if: steps.download.outputs.found == 'true'
        run: make check-llvm MIPSX_LLVM_BIN="${{ steps.toolchain.outputs.bin }}"

      - name: Build the sysroot and picolibc from this commit
        if: steps.download.outputs.found == 'true'
        run: |
          make libc MIPSX_LLVM_BIN="${{ steps.toolchain.outputs.bin }}" \
            COMPILER_RT="$PWD/llvm-project/compiler-rt/lib/builtins" \
            PICOLIBC_SRC="$PWD/picolibc"
          "${{ steps.toolchain.outputs.bin }}/clang" --target=mipsx \
            --sysroot=build/sysroot -O2 release/examples/hello.c -o build/hello
          test "$(sim/mipsx-run --expect-exit=0 build/hello)" = "Hello, world! 42"

      # run_tests.py reports but does not fail; every test that runs
      # passed when this was written (S14).
      - name: compiler-rt builtins tests on the simulator
        if: steps.download.outputs.found == 'true'
        run: |
          python3 tests/run_tests.py builtins \
            --llvm-bin "${{ steps.toolchain.outputs.bin }}" \
            --compiler-rt "$PWD/llvm-project/compiler-rt" \
            --sysroot build/sysroot --results build/builtins.tsv -v
          if awk -F'\t' '$3 != "PASS" && $3 != "UNSUPPORTED" {bad = 1} END {exit !bad}' build/builtins.tsv; then
            echo "::error::builtins tests failed"
            exit 1
          fi
